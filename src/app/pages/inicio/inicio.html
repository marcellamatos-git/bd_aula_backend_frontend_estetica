<div class="painel-container">
  <div class="header-secao">
    <h1>Painel Inicial</h1>
    <p>Selecione uma opção abaixo para navegar pelo catálogo e seu carrinho.</p>
  </div>

  <div class="grid-cards">
    <!-- PRODUTOS & SERVIÇOS -->
    <div class="card-atalho" (click)="navegarPara('/catalogo')">
      <div class="icone-card">📦</div>
      <div class="texto-card">
        <h3>Produtos & Serviços</h3>
        <p>Acesse o catálogo completo para visualização.</p>
      </div>
    </div>

    <!-- CARRINHO -->
    <div class="card-atalho" (click)="navegarPara('/carrinho')">
      <div class="icone-card">🛒</div>
      <div class="texto-card">
        <h3>Carrinho / Pedidos</h3>
        <p>Monte pedidos e confira o carrinho de compras.</p>
      </div>
    </div>
  </div>

  <!-- ATALHO PARA O PAINEL ADMIN -->
  <div class="rodape-admin">
    <button class="btn-acesso-admin" (click)="navegarPara('/admin')">
      🔐 Ir para o Painel Administrativo
    </button>
  </div>
</div>
